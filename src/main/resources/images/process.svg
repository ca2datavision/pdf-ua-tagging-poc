<svg xmlns="http://www.w3.org/2000/svg" width="495" height="80" viewBox="0 0 495 80">
  <!-- Three step process diagram. The labels are converted to shapes by the PDF exporter. -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#333333"/>
    </marker>
  </defs>
  <g font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
    <rect x="10" y="15" width="125" height="50" rx="8" fill="#0B3C5D"/>
    <text x="72.5" y="45">1. Collect</text>
    <rect x="185" y="15" width="125" height="50" rx="8" fill="#1D6FA5"/>
    <text x="247.5" y="45">2. Analyse</text>
    <rect x="360" y="15" width="125" height="50" rx="8" fill="#0B3C5D"/>
    <text x="422.5" y="45">3. Report</text>
  </g>
  <line x1="140" y1="40" x2="180" y2="40" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="315" y1="40" x2="355" y2="40" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
