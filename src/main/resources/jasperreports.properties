# --- PDF tagging -------------------------------------------------------------------------
# JasperReports Community Edition (7.0.8+) ships no working PDF tagger: the default factory
# (DefaultPdfTaggerFactory) throws "Tagged PDF export is not supported" as soon as a report
# asks for net.sf.jasperreports.export.pdf.tagged=true. The real tagger now lives in the
# commercial Professional extensions, which this project deliberately does not use.
# The silent factory turns every tagging call into a no-op, so Jasper always produces a plain,
# untagged PDF and the PDFBox post-processor (PdfUaPostProcessor) does all the tagging.
net.sf.jasperreports.export.pdf.tagger.factory=net.sf.jasperreports.pdf.common.SilentPdfTaggerFactory

# --- Accessibility hints -----------------------------------------------------------------
# Element properties starting with "pdfua." are copied from the template to the filled
# report (JasperPrint), where JasperLayoutExtractor picks them up for the post-processor.
net.sf.jasperreports.print.transfer.pdfua=pdfua.

# --- Fonts -------------------------------------------------------------------------------
# PDF/UA requires every font to be embedded. DejaVu comes from the jasperreports-fonts
# extension, which embeds it. Fail the fill instead of silently falling back to a
# non-embedded base font when a template names a font that has no extension.
net.sf.jasperreports.default.font.name=DejaVu Sans
net.sf.jasperreports.awt.ignore.missing.font=false
